services:
        backend:
                build:
                        context: .
                        dockerfile: Dockerfile
                container_name: fastapi_server
                expose:
                        - "8000"
                volumes:
                        - backend_logs:/app/logs/backend
                command: >
                        uvicorn main:app --host 0.0.0.0 --port 8000
                env_file:
                        - .env
                depends_on:
                        db:
                                condition: service_healthy
                        kafka:
                                condition: service_started
                        chroma:
                                condition: service_started
                        redis:
                                condition: service_healthy
                networks:
                        - app_network
                restart: unless-stopped
                logging:
                        driver: "json-file"
                        options:
                                max-size: "10m"
                                max-file: "3"
                environment:
                        - LOG_LEVEL=INFO
                        - LOG_FORMAT=json
                        - LOG_DIR=/app/logs/backend
                        - LOG_RETENTION_DAYS=30
                healthcheck:
                        test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
                        interval: 30s
                        timeout: 10s
                        retries: 3
                        start_period: 40s

        frontend:
                build:
                        context: ./frontend
                        dockerfile: Dockerfile
                container_name: vite_frontend
                expose:
                        - "80"
                networks:
                        - app_network
                restart: unless-stopped

        zookeeper:
                image: confluentinc/cp-zookeeper:7.5.3
                container_name: zookeeper
                environment:
                        ZOOKEEPER_CLIENT_PORT: 2181
                        ZOOKEEPER_TICK_TIME: 2000
                volumes:
                        - zookeeper_data:/var/lib/zookeeper/data
                        - zookeeper_log:/var/lib/zookeeper/log
                networks:
                        - app_network
                restart: unless-stopped

        kafka:
                image: confluentinc/cp-kafka:7.5.3
                container_name: kafka
                expose:
                        - "9093"
                depends_on:
                        - zookeeper
                environment:
                        KAFKA_BROKER_ID: 1
                        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
                        KAFKA_LISTENERS: BROKER://:9093
                        KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9093
                        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT
                        KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
                        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
                        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
                volumes:
                        - kafka_data:/var/lib/kafka/data
                networks:
                        - app_network
                restart: unless-stopped

        kafka-ui:
                image: provectuslabs/kafka-ui:latest
                container_name: kafka_ui
                expose:
                        - "8080"
                depends_on:
                        - kafka
                environment:
                        KAFKA_CLUSTERS_0_NAME: local-kafka
                        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
                        KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
                        SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
                networks:
                        - app_network
                restart: unless-stopped

        db:
                image: postgres:16-alpine
                container_name: postgres_db
                environment:
                        POSTGRES_DB: ${POSTGRES_DB:-fastapi_db}
                        POSTGRES_USER: ${POSTGRES_USER:-user}
                        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
                volumes:
                        - postgres_data:/var/lib/postgresql/data
                networks:
                        - app_network
                restart: unless-stopped
                healthcheck:
                        test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-fastapi_db}" ]
                        interval: 10s
                        timeout: 5s
                        retries: 5
                        start_period: 30s

        chroma:
                image: chromadb/chroma:latest
                container_name: chromadb_server
                expose:
                        - "8000"
                volumes:
                        - chroma_volume:/chroma/chroma
                environment:
                        IS_PERSISTENT: "TRUE"
                networks:
                        - app_network
                restart: unless-stopped

        redis:
                image: redis:7-alpine
                container_name: redis_cache
                volumes:
                        - redis_data:/data
                command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
                networks:
                        - app_network
                restart: unless-stopped
                healthcheck:
                        test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
                        interval: 10s
                        timeout: 5s
                        retries: 5

        nginx:
                image: nginx:alpine
                container_name: nginx_proxy
                ports:
                        - "80:80"
                        - "443:443"
                volumes:
                        - ./nginx.conf:/etc/nginx/nginx.conf:ro
                        - ./certbot/conf:/etc/letsencrypt
                        - ./certbot/www:/var/www/certbot
                        - ./.htpasswd:/etc/nginx/.htpasswd:ro
                depends_on:
                        - frontend
                        - backend
                networks:
                        - app_network
                restart: unless-stopped

volumes:
        zookeeper_data:
        zookeeper_log:
        kafka_data:
        postgres_data:
        backend_logs:
        chroma_volume:
        redis_data:


networks:
        app_network:
                driver: bridge
